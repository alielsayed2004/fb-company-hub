<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>شيتات F.B Company الداخلية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0B3C49;
      --teal: #114B5F;
      --emerald: #52B788;
      --forest: #2D6A4F;
      --mint: #EEF8F2;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --muted: #64748B;
      --danger: #B42318;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding: 0 16px calc(24px + env(safe-area-inset-bottom));
    }

    .wrap { max-width: 960px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 44px; height: 44px; border-radius: 14px;
      background: var(--navy); color: #8FD9B6;
      display: grid; place-items: center; font-weight: 800; font-size: 15px;
      letter-spacing: .5px; direction: ltr;
    }

    .brand h1 { margin: 0; font-size: 18px; color: var(--navy); line-height: 1.3; }
    .brand p { margin: 0; font-size: 12px; color: var(--muted); }

    .btn {
      font: inherit; font-weight: 700; font-size: 14px;
      border-radius: 12px; border: 1px solid transparent;
      padding: 12px 18px; cursor: pointer;
      transition: background-color .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease);
    }
    .btn-primary { background: var(--navy); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--teal); }
    .btn-primary:disabled { opacity: .6; cursor: wait; }
    .btn-ghost { background: #fff; border-color: var(--border); color: var(--muted); padding: 9px 14px; font-size: 13px; }
    .btn-ghost:hover { border-color: #CBD5E1; color: var(--navy); }

    :focus-visible { outline: 2px solid var(--emerald); outline-offset: 2px; }

    /* Login */
    .login {
      max-width: 400px; margin: 8vh auto 0;
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 28px 24px; box-shadow: 0 12px 32px -16px rgba(11, 60, 73, .18);
      animation: up .45s var(--ease) both;
    }
    .lock {
      width: 48px; height: 48px; border-radius: 14px; background: var(--mint); color: var(--forest);
      display: grid; place-items: center; margin-bottom: 16px;
    }
    .login h2 { margin: 0 0 6px; font-size: 20px; color: var(--navy); }
    .login p { margin: 0 0 20px; font-size: 14px; color: var(--muted); line-height: 1.7; }
    label { display: block; font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
    input[type="password"] {
      width: 100%; font: inherit; font-size: 16px; /* 16px stops iOS zoom on focus */
      padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: #fff;
      margin-bottom: 14px; outline: none; transition: border-color .3s var(--ease), box-shadow .3s var(--ease);
      direction: ltr; text-align: right;
    }
    input[type="password"]:focus { border-color: var(--emerald); box-shadow: 0 0 0 4px #D8F1E4; }
    .error { min-height: 22px; margin: 10px 0 0; font-size: 13px; color: var(--danger); text-align: center; }

    /* Sheets */
    .intro { margin: 8px 0 20px; animation: up .45s var(--ease) both; }
    .intro h2 { margin: 0 0 4px; font-size: 24px; color: var(--navy); }
    .intro p { margin: 0; font-size: 14px; color: var(--muted); }

    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; } }
    @media (min-width: 960px) { .grid { grid-template-columns: repeat(3, 1fr); } }

    .card {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; min-height: 76px;
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      color: inherit; text-decoration: none;
      box-shadow: 0 1px 2px rgba(11, 60, 73, .04);
      transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
      animation: up .45s var(--ease) both;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(82, 183, 136, .55);
      box-shadow: 0 12px 32px -12px rgba(11, 60, 73, .16);
    }
    .card:active { transform: translateY(-1px); }

    .tile {
      width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px;
      background: var(--mint); color: var(--forest);
      display: grid; place-items: center;
      transition: background-color .3s var(--ease), color .3s var(--ease);
    }
    .card:hover .tile { background: var(--navy); color: #8FD9B6; }

    .card-body { flex: 1; min-width: 0; }
    .card-num { font-size: 11px; font-weight: 700; color: #94A3B8; }
    .card-title {
      margin: 0; font-size: 16px; font-weight: 700; color: var(--navy); line-height: 1.5;
      overflow-wrap: anywhere; unicode-bidi: plaintext; text-align: right;
    }
    .arrow { color: #94A3B8; flex-shrink: 0; transition: transform .3s var(--ease), color .3s var(--ease); }
    .card:hover .arrow { color: #40916C; transform: translate(-2px, -2px); }

    .note { margin: 24px 0 0; font-size: 12px; color: var(--muted); text-align: center; }

    [hidden] { display: none !important; }

    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">F.B</div>
        <div>
          <h1>F.B Company</h1>
          <p>شيتات الشركة الداخلية</p>
        </div>
      </div>
      <button id="logout" class="btn btn-ghost" type="button" hidden>خروج</button>
    </header>

    <main>
      <form id="login" class="login" autocomplete="off">
        <div class="lock" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </div>
        <h2>صفحة داخلية</h2>
        <p>الصفحة دي لفريق F.B Company بس. اكتب الباسورد علشان تظهر الشيتات.</p>
        <label for="password">الباسورد</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />
        <button id="submit" class="btn btn-primary" type="submit">دخول</button>
        <p id="error" class="error" role="alert"></p>
      </form>

      <section id="sheets" hidden>
        <div class="intro">
          <h2>شيتات الشركة</h2>
          <p>دوس على أي شيت يفتح في تاب جديد.</p>
        </div>
        <div id="grid" class="grid"></div>
        <p class="note">ما تشاركش الباسورد أو اللينكات دي برّه فريق الشركة.</p>
      </section>
    </main>
  </div>

  <template id="card-template">
    <a class="card" target="_blank" rel="noopener noreferrer">
      <span class="tile" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2M14 13h2M8 17h2M14 17h2"/></svg>
      </span>
      <span class="card-body">
        <span class="card-num"></span>
        <p class="card-title" dir="auto"></p>
      </span>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M17 17V7H7"/></svg>
    </a>
  </template>

  <script>
    const form = document.getElementById('login');
    const input = document.getElementById('password');
    const submit = document.getElementById('submit');
    const errorBox = document.getElementById('error');
    const sheetsSection = document.getElementById('sheets');
    const grid = document.getElementById('grid');
    const logout = document.getElementById('logout');
    const template = document.getElementById('card-template');

    const SHEET_URL = /^https:\/\/docs\.google\.com\/spreadsheets\/d\/[A-Za-z0-9_-]+\/edit\?usp=sharing$/;

    const messages = {
      401: 'الباسورد غلط. جرّب تاني.',
      429: 'محاولات كتير غلط. استنى ربع ساعة وجرّب تاني.',
      500: 'الصفحة لسه مش متظبطة على السيرفر. كلّم المسؤول.',
    };

    function render(sheets) {
      grid.replaceChildren();
      sheets.forEach((sheet, i) => {
        if (!SHEET_URL.test(sheet.url)) return;
        const card = template.content.firstElementChild.cloneNode(true);
        card.href = sheet.url;
        card.style.animationDelay = `${i * 40}ms`;
        card.querySelector('.card-num').textContent = String(i + 1).padStart(2, '0');
        card.querySelector('.card-title').textContent = sheet.title;
        card.setAttribute('aria-label', `${sheet.title} (يفتح في تاب جديد)`);
        grid.appendChild(card);
      });
      form.hidden = true;
      sheetsSection.hidden = false;
      logout.hidden = false;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';
      submit.disabled = true;
      submit.textContent = 'جاري الدخول…';
      try {
        const response = await fetch('/api/sheets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: input.value }),
          cache: 'no-store',
        });
        if (!response.ok) {
          errorBox.textContent = messages[response.status] || 'حصلت مشكلة. جرّب تاني.';
          input.select();
          return;
        }
        const data = await response.json();
        input.value = '';
        render(Array.isArray(data.sheets) ? data.sheets : []);
      } catch {
        errorBox.textContent = 'مفيش اتصال بالإنترنت. جرّب تاني.';
      } finally {
        submit.disabled = false;
        submit.textContent = 'دخول';
      }
    });

    // Links are kept only in memory: logging out or reloading clears them.
    logout.addEventListener('click', () => {
      grid.replaceChildren();
      sheetsSection.hidden = true;
      logout.hidden = true;
      form.hidden = false;
      input.focus();
    });
  </script>
</body>
</html>
